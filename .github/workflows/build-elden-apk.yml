name: Build Elden Games APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode uploaded source
        run: |
          if [ ! -f elden-source.zip.b64 ]; then
            echo "Source archive has not been uploaded yet; waiting for the next push."
            exit 0
          fi
          base64 -d elden-source.zip.b64 > elden-source.zip
          mkdir source
          unzip -q elden-source.zip -d source
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Flutter project
        run: |
          flutter create --org com.eldengames --project-name elden_games --platforms=android build_app
          rm -rf build_app/lib
          cp -r source/app/lib build_app/lib
          cp -r source/app/assets build_app/assets
          cp source/app/pubspec.yaml build_app/pubspec.yaml
          python3 source/.github/scripts/patch_android.py
      - name: Build release APK
        working-directory: build_app
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: EldenGames-app-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
